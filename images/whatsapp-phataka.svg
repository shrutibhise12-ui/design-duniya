<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
<style>
.il-paper{fill:#fff;stroke:#111;stroke-width:1.5}.il-line{fill:none;stroke:#111;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.il-ink{fill:#111}.il-mute{fill:#D6D6D6}.il-white{fill:#fff}.il-hot{fill:#FF4B14}
.il-spark{fill:none;stroke-width:4;stroke-linecap:round}
@media (prefers-reduced-motion:no-preference){.burst{animation:b 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}.dot{animation:g 2.2s ease-in-out infinite}}
@keyframes b{0%{transform:scale(.55);opacity:0}18%{opacity:1}60%{transform:scale(1);opacity:1}100%{transform:scale(1.08);opacity:0}}
@keyframes g{0%,100%{opacity:1}50%{opacity:.55}}
</style>

