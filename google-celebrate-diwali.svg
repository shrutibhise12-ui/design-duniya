<g transform="translate(200 162)"><rect class="il-acc" x="-16" y="-16" width="32" height="32" transform="rotate(45)"/><rect class="il-white" x="-8" y="-8" width="16" height="16" transform="rotate(45)"/></g>
<g transform="translate(298 160)"><path class="il-line" d="M-22 -18Q0 -4 22 -18"/><circle class="il-hot" cx="-12" cy="-10" r="5"/><circle class="il-acc" cx="0" cy="-6" r="5"/><circle class="il-hot" cx="12" cy="-10" r="5"/><rect class="il-ink" x="-14" y="6" width="28" height="18" rx="3"/></g>
