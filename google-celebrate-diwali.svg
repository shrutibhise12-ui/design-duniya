<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 267">
<style>
.il-paper{fill:#fff;stroke:#111;stroke-width:1.5}.il-line{fill:none;stroke:#111;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.il-ink{fill:#111}.il-mute{fill:#D6D6D6}.il-white{fill:#fff}.il-acc{fill:#1F3BFF}.il-hot{fill:#FF4B14}
.il-spark{fill:none;stroke-width:4;stroke-linecap:round}
.il-flame{fill:#FF4B14;transform-box:fill-box;transform-origin:50% 100%}
.il-sans{font-family:"Noto Sans","Segoe UI",system-ui,sans-serif;font-weight:600}
@media (prefers-reduced-motion:no-preference){.il-flame{animation:f 1.8s ease-in-out infinite}.burst{animation:b 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}}
@keyframes f{0%,100%{transform:scale(1,1) rotate(0)}30%{transform:scale(.92,1.1) rotate(-3deg)}60%{transform:scale(1.06,.92) rotate(2deg)}}
@keyframes b{0%{transform:scale(.55);opacity:0}18%{opacity:1}60%{transform:scale(1);opacity:1}100%{transform:scale(1.08);opacity:0}}
</style>

<rect class="il-paper" x="60" y="34" width="280" height="46" rx="23"/>
